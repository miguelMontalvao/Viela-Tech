<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Viela Tech · Saúde nas vielas da Rocinha</title>
    <meta name="description" content="Autotriagem de tosse, fila de visitas dos Agentes Comunitários de Saúde e mapa da tuberculose na Rocinha. Onde o sol não chega, a saúde chega." />
    <meta name="theme-color" content="#F8FAFC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Viela Tech · Onde o sol não chega, a saúde chega" />
    <meta property="og:description" content="Triagem de tuberculose e apoio aos Agentes Comunitários de Saúde na Rocinha, Rio de Janeiro." />
    <meta property="og:image" content="https://viela-tech.vercel.app/og-image.jpg" />
    <meta property="og:url" content="https://viela-tech.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://viela-tech.vercel.app/" />

    <script>
      // Na Home, a foto do hero é o maior elemento da tela: começa a baixar junto com o HTML.
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/avif';
        l.setAttribute('imagesrcset', '/img/rocinha-por-do-sol-400.avif 400w, /img/rocinha-por-do-sol-640.avif 640w, /img/rocinha-por-do-sol-960.avif 960w, /img/rocinha-por-do-sol-1024.avif 1024w');
        l.setAttribute('imagesizes', '(min-width: 1024px) 576px, 100vw');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
      // Tema claro é o padrão; o escuro só entra se a pessoa escolheu antes.
      try {
        if (localStorage.getItem('viela_tema') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
      // Abertura: só na primeira página da sessão e sem "reduzir movimento".
      try {
        var reduz = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduz && !sessionStorage.getItem('viela_intro')) {
          document.documentElement.classList.add('com-intro');
          sessionStorage.setItem('viela_intro', '1');
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      html.com-intro #intro {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(ellipse at 50% 40%, #0c4a6e 0%, #020617 60%); color: #fff;
        font-family: 'Inter', system-ui, sans-serif;
        animation: introSai 0.85s cubic-bezier(0.76, 0, 0.24, 1) 1.2s forwards;
      }
      #intro svg { width: 92px; height: auto; overflow: visible; }
      #intro path { opacity: 0; transform-box: fill-box; transform-origin: center; animation: introPeca 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.2) forwards; }
      #intro .p1 { animation-delay: 0.05s; --de: translate(-40%, 30%); }
      #intro .p2 { animation-delay: 0.2s; --de: translate(40%, -40%); }
      #intro .p3 { animation-delay: 0.35s; --de: translate(0, 50%); }
      #intro .nome { font-size: 28px; letter-spacing: 0.4em; font-weight: 300; opacity: 0; animation: introNome 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.45s forwards; }
      #intro .nome b { font-weight: 600; }
      #intro .nome span { color: #38bdf8; }
      #intro .barra { width: 160px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; }
      #intro .barra i { display: block; height: 100%; background: linear-gradient(90deg, #0284c7, #10b981); transform: scaleX(0); transform-origin: left; animation: introBarra 1.1s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      @keyframes introPeca { from { opacity: 0; transform: var(--de) scale(0.6); } to { opacity: 1; transform: none; } }
      @keyframes introNome { from { opacity: 0; letter-spacing: 0.4em; } to { opacity: 1; letter-spacing: -0.01em; } }
      @keyframes introBarra { to { transform: scaleX(1); } }
      @keyframes introSai { to { transform: translateY(-100%); visibility: hidden; } }
      html.com-intro body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <svg viewBox="20 10 720 550">
        <path class="p1" fill="#0284C7" d="M55 125H178Q205 125 218 148L378 430Q384 450 362 450H215Q188 450 176 428L40 147Q30 125 55 125Z" />
        <path class="p2" fill="#10B981" d="M520 28H705Q724 28 714 45L615 200Q606 212 590 212H445Q405 212 382 242L333 300L282 214Q276 204 286 196L488 42Q502 28 520 28Z" />
        <path class="p3" fill="#38BDF8" d="M432 250L566 246Q584 246 574 262L410 528Q398 546 397 524L400 290Q401 252 432 250Z" />
      </svg>
      <p class="nome"><b>Viela</b><span>Tech</span></p>
      <div class="barra"><i></i></div>
    </div>
    <div id="root"></div>
    <noscript>O Viela Tech precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
